name: Trigger Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Select version release type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      exact_version:
        description: 'Exact version (e.g. "v1.2.3", optional override)'
        required: false
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Set up Docker Build Cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: ${{ runner.os }}-ci-cache-${{ hashFiles('cicd/**') }}
          restore-keys: |
            ${{ runner.os }}-ci-cache-

      - name: Build CI runner container
        run: docker build -t ci-runner cicd

      - name: Prepare local cache directory
        run: |
          HOST_CACHE="$(pwd)/.cache"
          mkdir -p "$HOST_CACHE"
          chmod -R 777 "$HOST_CACHE"

      - name: Run Release Script via Docker
        env:
          EXACT: ${{ github.event.inputs.exact_version }}
          TYPE: ${{ github.event.inputs.release_type }}
        run: |
          docker run --rm \
            -u "$(id -u):$(id -g)" \
            -e GOCACHE=/cache/go-cache \
            -e GOPATH=/cache/go-path \
            -e GOLANGCI_LINT_CACHE=/cache/golangci-lint \
            -v "$(pwd)/.cache:/cache" \
            -v "$(pwd):/app" \
            -w /app \
            ci-runner go run cicd release "${EXACT:-$TYPE}"
